<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1d5c">
<meta name="description" content="Huat Homes — a Singapore property match-3 game. Match HDB flats, condos and shophouses to build your S$ portfolio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Huat Homes">
<meta name="application-name" content="Huat Homes">
<title>Huat Homes — SG Property Match-3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd23f;--ink:#2b1d5c;--panel:rgba(30,18,78,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:Nunito,system-ui,sans-serif;color:#fff;background:#3a2470}
button{font-family:inherit}
#bg{position:fixed;inset:0;background:linear-gradient(180deg,#2e2068 0%,#6b3a92 36%,#d9628c 68%,#ffb07a 100%);z-index:-3}
#sun{position:fixed;left:50%;bottom:14vh;width:46vmin;height:46vmin;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffe7a3 0%,#ffb36b 55%,rgba(255,140,100,0) 72%);z-index:-2;opacity:.75}
#skyline{position:fixed;left:0;right:0;bottom:0;width:100%;height:34vh;z-index:-1}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}

/* ---------- buttons ---------- */
.btn{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;border:0;color:#fff;border-radius:18px;padding:12px 22px;font-size:18px;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.2);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.4)}
.btn:disabled{filter:grayscale(.8) brightness(.8);cursor:default}
.gold{background:linear-gradient(#ffe07a,#ff9f1c);color:#5a2d00;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.teal{background:linear-gradient(#5ff0cd,#12a58e)}
.purple{background:linear-gradient(#a58bff,#6a45d8)}
.pink{background:linear-gradient(#ff86b0,#e0457b)}
.ghost{background:rgba(255,255,255,.16);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.big{font-size:22px;padding:15px 26px;width:min(78vw,300px)}
.small{font-size:16px;padding:10px 16px}

/* ---------- title ---------- */
#title{justify-content:center;gap:14px;text-align:center}
.parade{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
.parade img{width:min(12vw,58px);height:min(12vw,58px);animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.parade img:nth-child(2){animation-delay:.2s}.parade img:nth-child(3){animation-delay:.4s}.parade img:nth-child(4){animation-delay:.6s}.parade img:nth-child(5){animation-delay:.8s}.parade img:nth-child(6){animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:min(17vw,84px);line-height:.92;margin:0;letter-spacing:.5px;
  background:linear-gradient(#fff6b0,#ffd23f 45%,#ff8a1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #6a2a8a) drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.logo span{display:block;font-size:.62em;background:linear-gradient(#ffffff,#ffd6f0);-webkit-background-clip:text;background-clip:text}
.tag{margin:0 0 10px;font-weight:800;font-size:16px;opacity:.95;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- levels ---------- */
#levels{padding-top:calc(env(safe-area-inset-top) + 10px)}
.lv-head{width:100%;max-width:560px;display:flex;align-items:center;gap:12px;padding:8px 14px}
.lv-head h2{font-family:Fredoka,Nunito,system-ui,sans-serif;margin:0;font-size:26px;flex:1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.lv-scroll{flex:1;width:100%;max-width:560px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 14px calc(env(safe-area-inset-bottom) + 24px)}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:12px}
.lv{aspect-ratio:1/1.08;border:0;border-radius:18px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:24px;color:#fff;cursor:pointer;
  background:linear-gradient(#a58bff,#6a45d8);box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv.cur{background:linear-gradient(#ffe07a,#ff9f1c);color:#5a2d00;animation:pulse 1.4s ease-in-out infinite}
.lv.locked{background:rgba(255,255,255,.14);color:rgba(255,255,255,.5);box-shadow:none;cursor:default}
.lv .st{font-size:13px;letter-spacing:1px;color:#ffe066;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.lv .st i{font-style:normal;color:rgba(255,255,255,.3)}
.lv.cur .st{color:#7a3a00}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- game ---------- */
#game{width:100%;max-width:620px;margin:0 auto;gap:8px;align-items:stretch;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);
  grid-template-areas:"top" "goals" "board" "boost";grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.screen#game.active{display:grid}
.topbar{grid-area:top;display:flex;align-items:center;gap:10px}
.iconbtn{width:46px;height:46px;border-radius:15px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.lvl{flex:1;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:22px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.lvl small{display:block;font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:12px;opacity:.85;letter-spacing:.3px;text-shadow:none}
.moves{min-width:66px;height:62px;border-radius:20px;background:linear-gradient(#fff,#ffe9f4);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.moves .mv{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1}
.moves .lbl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;opacity:.7}
.moves.low{background:linear-gradient(#ffd0d0,#ff8a8a);animation:pulse .9s ease-in-out infinite}
.goals{grid-area:goals;background:var(--panel);border-radius:18px;padding:9px 13px 10px;border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.goal-row{display:flex;align-items:baseline;gap:6px;font-weight:800}
.goal-row .label{font-size:12px;text-transform:uppercase;letter-spacing:.7px;opacity:.8;flex:1}
#hudScore{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:22px;color:var(--gold)}
#hudTarget{font-size:14px;opacity:.85}
.bar{position:relative;height:14px;border-radius:8px;background:rgba(0,0,0,.35);margin:6px 8px 2px 0}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(90deg,#3ee08a,#ffd23f);transition:width .35s ease;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.bar .star{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:20px;color:#5b4a8a;text-shadow:0 1px 0 rgba(0,0,0,.4);transition:color .3s,transform .3s}
.bar .star.on{color:#ffd23f;transform:translate(-50%,-50%) scale(1.2);text-shadow:0 0 8px rgba(255,210,63,.8)}
.ice-goal{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:800;font-size:14px}
.ice-goal .ice-ico{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#e8f8ff,#7cc2f5);display:grid;place-items:center;color:#3b86c9;font-size:14px;box-shadow:inset 0 0 0 1.5px #fff}
.ice-goal.done{color:#7dffb0}
.board-wrap{grid-area:board;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;position:relative}
#board{display:block;touch-action:none;border-radius:18px}
#tip{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(20,10,50,.85);padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:2}
#tip.show{opacity:1}
.boosters{grid-area:boost;display:flex;gap:10px;justify-content:center}
.booster{position:relative;flex:0 1 104px;min-width:84px;height:68px;border:0;border-radius:18px;color:#fff;cursor:pointer;background:linear-gradient(#8f6cff,#5a37c8);
  box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px}
.booster svg{width:28px;height:28px}
.booster:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.booster.active{background:linear-gradient(#ffe07a,#ff9f1c);color:#5a2d00;animation:pulse .9s ease-in-out infinite}
.booster:disabled{filter:grayscale(1) brightness(.7);cursor:default}
.booster .count{position:absolute;top:-7px;right:-5px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#ff4f7b;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:14px;display:grid;place-items:center;border:2px solid #fff}
@media (orientation:landscape) and (max-height:620px){
  #game{max-width:none;grid-template-areas:"top board" "goals board" "boost board";grid-template-columns:minmax(210px,290px) minmax(0,1fr);grid-template-rows:auto auto 1fr}
  .boosters{align-self:start;flex-wrap:wrap}
  .booster{height:58px}
}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(14,6,40,.62);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
.modal.hidden{display:none}
.card{width:min(92vw,390px);max-height:88vh;overflow-y:auto;touch-action:pan-y;background:linear-gradient(#6545c8,#3a2380);border:3px solid rgba(255,255,255,.28);border-radius:28px;padding:22px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:pop .32s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:32px;margin:0 0 6px;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.card h3{font-family:Fredoka,Nunito,system-ui,sans-serif;margin:16px 0 6px;font-size:19px}
.card p{margin:6px 0;font-weight:700;line-height:1.4}
.card .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:18px}
.goal-list{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px;text-align:left}
.goal{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px;font-weight:800}
.goal .gi{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;font-size:18px;background:rgba(255,255,255,.15)}
.goal .gi.ice{background:linear-gradient(135deg,#e8f8ff,#7cc2f5);color:#3b86c9}
.goal img{width:34px;height:34px}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 4px;font-size:52px;line-height:1}
.stars span{color:rgba(255,255,255,.2);transform:scale(.4);transition:transform .35s cubic-bezier(.2,1.8,.4,1),color .2s}
.stars span.on{color:#ffd23f;transform:scale(1);text-shadow:0 0 18px rgba(255,210,63,.75),0 4px 0 #b86b00}
.stars span:nth-child(2){font-size:64px;margin-top:-10px}
.big-score{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:30px;color:#fff}
.how{text-align:left}
.how .item{display:flex;gap:12px;align-items:center;margin:10px 0;font-weight:700;line-height:1.35}
.how .item .ico{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.22);font-size:22px}
.how .item .ico img{width:40px;height:40px}
.pieces-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.pieces-grid div{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:800}
.pieces-grid img{width:46px;height:46px;display:block;margin:0 auto 4px}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:rgba(0,0,0,.22);border:0;color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;font-size:16px;cursor:pointer;margin:6px 0}
.toggle .sw{width:50px;height:28px;border-radius:14px;background:rgba(255,255,255,.25);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on .sw{background:#3ee08a}
.toggle.on .sw::after{left:25px}
.muted{opacity:.75;font-size:13px}
.install{display:inline-flex;align-items:center;gap:8px;margin-top:6px}
.install[hidden]{display:none}
.ios-steps{text-align:left;margin:12px 0 4px;display:flex;flex-direction:column;gap:10px}
.ios-steps div{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px;font-weight:800}
.ios-steps .n{width:28px;height:28px;flex:none;border-radius:50%;background:#ffd23f;color:#5a2d00;display:grid;place-items:center;font-family:Fredoka,Nunito,system-ui,sans-serif}
.ios-steps svg{vertical-align:-4px}
</style>
</head>
<body>
<div id="bg"></div>
<div id="sun"></div>
<svg id="skyline" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>

<!-- TITLE -->
<section id="title" class="screen active">
  <div class="parade" id="parade"></div>
  <h1 class="logo">Huat<span>Homes</span></h1>
  <p class="tag">Match your way from BTO to bungalow</p>
  <button class="btn big gold" id="btnPlay">Play</button>
  <button class="btn big teal" id="btnZen">Zen Mode</button>
  <div class="row">
    <button class="btn small purple" id="btnLevels">Levels</button>
    <button class="btn small purple" id="btnHow">How to play</button>
    <button class="btn small purple" id="btnSettings" aria-label="Settings">Settings</button>
  </div>
  <button class="btn small ghost install" id="btnInstall" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>Install app</button>
</section>

<!-- LEVEL SELECT -->
<section id="levels" class="screen">
  <div class="lv-head">
    <button class="iconbtn" id="lvBack" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>Choose a level</h2>
  </div>
  <div class="lv-scroll"><div class="lv-grid" id="lvGrid"></div></div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="btnPause" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="2" width="5" height="16" rx="2" fill="#fff"/><rect x="12" y="2" width="5" height="16" rx="2" fill="#fff"/></svg></button>
    <div class="lvl" id="hudLevel">Level 1<small id="hudSub">Singapore property match-3</small></div>
    <div class="moves" id="movesBox"><div class="mv" id="hudMoves">24</div><div class="lbl">moves</div></div>
  </div>
  <div class="goals">
    <div class="goal-row"><span class="label">Portfolio</span><span id="hudScore">S$0</span><span id="hudTarget">/ S$1.00M</span></div>
    <div class="bar" id="hudBar"><div class="fill" id="hudFill"></div><i class="star" id="st1" style="left:55.5%">★</i><i class="star" id="st2" style="left:77.7%">★</i><i class="star" id="st3" style="left:98%">★</i></div>
    <div class="ice-goal" id="hudIce"><span class="ice-ico">❄</span><span id="hudIceText">Cooling measures left: 0</span></div>
  </div>
  <div class="board-wrap" id="boardWrap"><div id="tip"></div><canvas id="board" aria-label="Game board"></canvas></div>
  <div class="boosters">
    <button class="booster" id="bHammer"><svg viewBox="0 0 32 32"><rect x="14" y="12" width="5" height="18" rx="2" transform="rotate(-40 16 20)" fill="#ffd9a8" stroke="#6b3a00" stroke-width="1.5"/><rect x="5" y="4" width="18" height="9" rx="2.5" transform="rotate(-40 14 8)" fill="#cfd8e3" stroke="#334" stroke-width="1.5"/></svg>Demolish<span class="count" id="cHammer">2</span></button>
    <button class="booster" id="bShuffle"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h6c6 0 8 14 14 14h4"/><path d="M4 23h6c2.5 0 4-2.4 5.3-5"/><path d="M18 11c1.4-1.3 3-2 6-2h4"/><path d="m24 5 4 4-4 4"/><path d="m24 19 4 4-4 4"/></svg>En-bloc<span class="count" id="cShuffle">2</span></button>
    <button class="booster" id="bExtend"><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="11" fill="#fff" stroke="#3a2380" stroke-width="2"/><path d="M16 10v7l5 3" stroke="#3a2380" stroke-width="2.6" fill="none" stroke-linecap="round"/><rect x="12" y="2" width="8" height="4" rx="1.5" fill="#fff"/></svg>+5 Lease<span class="count" id="cExtend">1</span></button>
  </div>
</section>

<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>

<script>
'use strict';
/* =========================================================
   HUAT HOMES — a Singapore-property match-3
   ========================================================= */
const ROWS = 8, COLS = 8, PAD = 6;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
let TS = 1; // animation time scale (debug)
const $ = id => document.getElementById(id);

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const progress = Object.assign({maxLevel:1, stars:{}, zenBest:0}, store.get('hh_progress', {}));
const settings = Object.assign({music:true, sfx:true, haptics:true}, store.get('hh_settings', {}));
const saveProgress = () => store.set('hh_progress', progress);
const saveSettings = () => store.set('hh_settings', settings);

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const key = (r,c) => r*COLS + c;
const rc = k => [Math.floor(k/COLS), k%COLS];
const inB = (r,c) => r>=0 && r<ROWS && c>=0 && c<COLS;
const sleep = ms => new Promise(res => setTimeout(res, ms*TS));
function fmt(k){
  if (k <= 0) return 'S$0';
  if (k >= 1e6) return 'S$' + (k/1e6).toFixed(2) + 'B';
  if (k >= 1000) return 'S$' + (k/1000).toFixed(2) + 'M';
  return 'S$' + Math.round(k) + 'K';
}
const E = {
  lin:t=>t, outQuad:t=>1-(1-t)*(1-t), inQuad:t=>t*t,
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outBack:t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  inBack:t=>{const c1=1.70158;return (c1+1)*t*t*t-c1*t*t;}
};

/* =========================================================
   ART — pieces as inline SVG
   ========================================================= */

const AC = {ctx:null, out:null, sfx:null, mus:null, noise:null};

    AC.mus = AC.ctx.createGain(); AC.mus.gain.value = settings.music ? .55 : 0; AC.mus.connect(AC.out);
    const len = AC.ctx.sampleRate * 1; const buf = AC.ctx.createBuffer(1, len, AC.ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1; AC.noise = buf;

}
function tone(f, dur, o = {}){

  osc.connect(g); g.connect(music ? AC.mus : AC.sfx); osc.start(t); osc.stop(t + dur + .05);
}
function noise(dur, o = {}){
  if (!AC.ctx || !AC.noise) return; const music = o.dest === 'mus'; if (!music && !settings.sfx) return;

  const f = AC.ctx.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1200, t);

  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(music ? AC.mus : AC.sfx); src.start(t, Math.random()*.5); src.stop(t + dur + .05);

/* music: gentle pentatonic loop, I–vi–IV–V */
const MUS = {timer:null, step:0, next:0};
const STEP = 60/92/2;
const MPENT = [261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];
const BASS = [130.81,110,87.31,98];
const CH = [[0,2,3,5,7,8],[4,0,2,5,7],[4,0,5,6],[3,1,6,8]];
const MEL = (() => { const r = mulberry32(11); const a = []; for (let b=0;b<8;b++){ const ch = CH[b%4]; for (let s=0;s<8;s++){ a.push((s===0 || r()<.5) ? MPENT[ch[Math.floor(r()*ch.length)]] : 0); } } return a; })();
function startMusic(){ if (!AC.ctx || MUS.timer) return; MUS.next = AC.ctx.currentTime + .1; MUS.timer = setInterval(schedMusic, 40); }
function stopMusic(){ clearInterval(MUS.timer); MUS.timer = null; }
function schedMusic(){
  if (!AC.ctx) return;
  while (MUS.next < AC.ctx.currentTime + .25){
    const s = MUS.step % 64, bar = Math.floor(s/8) % 4, beat = s % 8, t = MUS.next;
    if (beat === 0 || beat === 4) tone(BASS[bar], STEP*3.6, {type:'triangle', vol:.13, at:t, dest:'mus', att:.02});
    if (beat === 2 || beat === 6) tone(BASS[bar]*2, STEP*1.2, {vol:.05, at:t, dest:'mus'});
    const m = MEL[s]; if (m){ tone(m, STEP*1.9, {vol:.07, at:t, dest:'mus', att:.015}); tone(m*2, STEP*1.2, {vol:.012, at:t+STEP*.5, dest:'mus'}); }
    if (beat % 2 === 1) noise(.035, {ft:'highpass', f:7000, vol:.02, at:t, dest:'mus'});
    MUS.step++; MUS.next += STEP;
  }
}

/* ---------- levels ---------- */
function levelConfig(n){
  const rng = mulberry32(n*7919 + 17);
  const moves = Math.max(17, 25 - Math.floor((n-1)/4));
  const numTypes = n <= 3 ? 5 : 6;
  let iceCount = 0;
  if (n >= 2 && !(n % 4 === 1 && n < 20)) iceCount = Math.min(2 + Math.floor(n*.45), 14);
  iceCount -= iceCount % 2;
  const maxLayer = n < 8 ? 1 : n < 20 ? 2 : 3;
  const map = emptyMap(0); let placed = 0, guard = 0;
  while (placed < iceCount && guard++ < 600){
    const r = 2 + Math.floor(rng()*6), c = Math.floor(rng()*4);
    if (map[r][c]) continue;
    let L = 1; if (maxLayer > 1 && rng() < .4) L = 2; if (maxLayer > 2 && rng() < .2) L = 3;
    map[r][c] = L; map[r][COLS-1-c] = L; placed += 2;
  }
  const perMove = Math.min(240, 120 + n*6);
  const target = Math.round(moves * perMove * (placed ? .8 : 1) / 50) * 50;
  return {n, moves, numTypes, blk:map, target, iceCount:placed, maxLayer};
}

/* ---------- board helpers ---------- */
function cellType(r,c){ if (!inB(r,c) || blk[r][c]) return -9; const p = grid[r][c]; if (!p || p.type < 0) return -9; return p.type; }
function findRuns(){
  const runs = [];
  for (let r=0;r<ROWS;r++){ let c = 0; while (c < COLS){ const t = cellType(r,c); if (t < 0){ c++; continue; } let e = c+1; while (e < COLS && cellType(r,e) === t) e++; if (e-c >= 3){ const cells = []; for (let k=c;k<e;k++) cells.push(key(r,k)); runs.push({dir:'h', cells, type:t}); } c = e; } }
  for (let c=0;c<COLS;c++){ let r = 0; while (r < ROWS){ const t = cellType(r,c); if (t < 0){ r++; continue; } let e = r+1; while (e < ROWS && cellType(e,c) === t) e++; if (e-r >= 3){ const cells = []; for (let k=r;k<e;k++) cells.push(key(k,c)); runs.push({dir:'v', cells, type:t}); } r = e; } }
  return runs;
}
function computeGroups(pref){
  const runs = findRuns(); if (!runs.length) return [];
  const parent = runs.map((_,i) => i); const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const owner = new Map();
  runs.forEach((run,i) => run.cells.forEach(k => { if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i); }));
  const gm = new Map(); runs.forEach((run,i) => { const root = find(i); if (!gm.has(root)) gm.set(root, []); gm.get(root).push(run); });
  const groups = [];
  for (const rs of gm.values()){
    const cells = new Set(); rs.forEach(r => r.cells.forEach(k => cells.add(k)));
    const type = rs[0].type, maxLen = Math.max(...rs.map(r => r.cells.length));
    const hasH = rs.some(r => r.dir === 'h'), hasV = rs.some(r => r.dir === 'v');
    let special = null;
    if (maxLen >= 5) special = 'bomb'; else if (hasH && hasV) special = 'wrap'; else if (maxLen === 4) special = rs[0].dir === 'h' ? 'v' : 'h';

    if (special){
      if (pref) for (const [r,c] of pref){ if (cells.has(key(r,c))){ at = key(r,c); break; } }
      if (at == null && special === 'wrap'){
        const hc = new Set(); rs.filter(r => r.dir === 'h').forEach(r => r.cells.forEach(k => hc.add(k)));
        outer: for (const r of rs.filter(r => r.dir === 'v')) for (const k of r.cells) if (hc.has(k)){ at = k; break outer; }
      }
      if (at == null){ const L = rs.reduce((a,b) => b.cells.length > a.cells.length ? b : a); at = L.cells[Math.floor((L.cells.length-1)/2)]; }

function matchAt(r,c){
  const t = cellType(r,c); if (t < 0) return false;

  n = 1; for (let k=r-1; cellType(k,c)===t; k--) n++; for (let k=r+1; cellType(k,c)===t; k++) n++; return n >= 3;
}
function hasMove(){

    for (const [dr,dc] of [[0,1],[1,0]]){

      if (p.special === 'bomb' || q.special === 'bomb' || (p.special && q.special)) return [r,c,r2,c2];
      grid[r][c] = q; grid[r2][c2] = p; const ok = matchAt(r,c) || matchAt(r2,c2); grid[r][c] = p; grid[r2][c2] = q;

    }

const tweens = [];
function tween(obj, to, dur, ease = E.outQuad, delay = 0){
  return new Promise(res => { const from = {}; for (const k in to) from[k] = obj[k]; tweens.push({obj, from, to, dur:Math.max(1,dur*TS), ease, start:performance.now() + delay*TS, res}); });
}
function updateTweens(now){
  for (let i = tweens.length-1; i >= 0; i--){
    const t = tweens[i]; let p = (now - t.start) / t.dur; if (p < 0) continue; if (p > 1) p = 1;
    const e = t.ease(p); for (const k in t.to) t.obj[k] = t.from[k] + (t.to[k] - t.from[k]) * e;

}

   CORE RESOLUTION
   ========================================================= */
function mostCommonType(exclude){
  const cnt = Array(TYPES.length).fill(0);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ const p = grid[r][c]; if (p && p.type >= 0 && !exclude.has(key(r,c))) cnt[p.type]++; }
  let best = 0; for (let i=1;i<cnt.length;i++) if (cnt[i] > cnt[best]) best = i; return best;
}
async function clearStep({groups = [], forced = [], fx = [], bonus = 0, cascade = 1}){
  const clear = new Set(), blkHit = new Set(), queue = [], effects = [...fx];

  for (const g of groups){
    for (const k of g.cells){ if (!clear.has(k)){ clear.add(k); queue.push(k); } }
  }
  for (const k of forced){ const [r,c] = rc(k); add(r,c); }
  const activated = new Set();
  while (queue.length){
    const k = queue.shift(); const [r,c] = rc(k); const p = grid[r][c];
    if (!p || !p.special || p.consumed || activated.has(k)) continue; activated.add(k);
    if (p.special === 'h'){ for (let cc=0;cc<COLS;cc++) add(r,cc); effects.push({kind:'beam', dir:'h', r, c}); bonus += 60; }
    else if (p.special === 'v'){ for (let rr=0;rr<ROWS;rr++) add(rr,c); effects.push({kind:'beam', dir:'v', r, c}); bonus += 60; }
    else if (p.special === 'wrap'){ for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) add(r+dr,c+dc); effects.push({kind:'ring', r, c, rad:1.8}); bonus += 80; }
    else if (p.special === 'bomb'){ const t = mostCommonType(clear); const tg = [];
      for (let rr=0;rr<ROWS;rr++) for (let cc=0;cc<COLS;cc++){ const q = grid[rr][cc]; if (q && q.type === t && !blk[rr][cc]){ add(rr,cc); tg.push([rr,cc]); } }
      effects.push({kind:'bolt', r, c, targets:tg}); bonus += 150; }
  }
  clear.forEach(k => { const [r,c] = rc(k); for (const [dr,dc] of DIRS){ const rr = r+dr, cc = c+dc; if (inB(rr,cc) && blk[rr][cc]) blkHit.add(key(rr,cc)); } });
  if (!clear.size && !blkHit.size) return false;

  // effects + sounds
  const now = performance.now();
  let big = 0;
  for (const e of effects){ e.t0 = now; fxList.push(e); if (e.kind === 'beam') big = Math.max(big,1); if (e.kind === 'ring') big = Math.max(big,2); if (e.kind === 'bolt') big = Math.max(big,3); if (e.kind === 'flash') big = 4; }
  if (big >= 3){ sfx.key(); addShake(cs*.35); buzz([30,40,70]); }
  if (big === 2 || big === 4){ sfx.blast(); addShake(cs*.28); buzz(45); }
  if (big === 1){ sfx.line(); addShake(cs*.12); buzz(25); }
  if (!big){ buzz(12); }
  if (clear.size) sfx.match(cascade);
  if (effects.length) await sleep(110);

  // score
  const gain = Math.round((clear.size*20 + bonus + blkHit.size*30 + groups.filter(g => g.special).length*50) * cascade * (state.finale ? .25 : 1));
  state.score += gain;
  let sx = 0, sy = 0; clear.forEach(k => { const [r,c] = rc(k); sx += c; sy += r; }); blkHit.forEach(k => { const [r,c] = rc(k); sx += c; sy += r; });
  const n = clear.size + blkHit.size; if (n) floater((sx/n + .5)*cs, (sy/n + .5)*cs, '+' + fmt(gain), cascade > 1 ? '#ffd23f' : '#fff', Math.min(1.5, .9 + gain/600));

  // remove pieces
  const proms = [];
  clear.forEach(k => { const [r,c] = rc(k); const p = grid[r][c]; if (!p) return; p.flash = 1;
    burst((c+.5)*cs, (r+.5)*cs, p.type >= 0 ? TYPES[p.type].color : '#ffd23f', 6);
    proms.push(tween(p, {scale:0, flash:0}, 200, E.inBack)); });
  // ice
  let lifted = 0;
  blkHit.forEach(k => { const [r,c] = rc(k); if (blk[r][c] > 0){ blk[r][c]--; burst((c+.5)*cs, (r+.5)*cs, '#cfeeff', blk[r][c] ? 5 : 12); if (!blk[r][c]) lifted++; } });
  if (blkHit.size){ sfx.ice(); }
  if (lifted) floater(COLS*cs/2, ROWS*cs*.18, lifted > 1 ? `${lifted} cooling measures lifted!` : 'Cooling measure lifted!', '#9fe6ff', .8);
  await Promise.all(proms);
  clear.forEach(k => { const [r,c] = rc(k); grid[r][c] = null; });

  // create specials
  let made = null;
  for (const g of groups){ if (!g.special) continue; const [r,c] = rc(g.at);
    const p = makePiece(g.special === 'bomb' ? -1 : g.type, g.special, r, c); p.scale = 0; grid[r][c] = p; tween(p, {scale:1}, 280, E.outBack);
    if (!made || g.special === 'bomb' || (g.special === 'wrap' && made !== 'bomb')) made = g.special; }
  if (made){ sfx.create(); buzz(20); }
  if (made === 'bomb') banner('Golden Key!', '#ffd23f');
  else if (cascade >= 2) banner(COMBO_WORDS[Math.min(cascade, COMBO_WORDS.length-1)]);
  else if (made === 'wrap') banner('Reno blast ready!', '#ffb4e6');

}
async function applyGravity(){
  const proms = [];
  for (let c=0;c<COLS;c++){
    let r = ROWS-1;
    while (r >= 0){
      if (blk[r][c]){ r--; continue; }
      const bottom = r; let top = r; while (top-1 >= 0 && !blk[top-1][c]) top--;
      let write = bottom;
      for (let rr=bottom; rr>=top; rr--){ const p = grid[rr][c]; if (p){ if (rr !== write){ grid[write][c] = p; grid[rr][c] = null; } write--; } }
      const missing = write - top + 1;
      for (let i=0;i<missing;i++){
        const rr = write - i; const p = makePiece(randType(), null, top-1-i, c);
        if (top > 0){ p.py = top - 1; p.alpha = 0; p.delay = i*90; }
        grid[rr][c] = p;
      }
      r = top - 1;
    }
  }
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const p = grid[r][c]; if (!p) continue; p.px = c;
    if (Math.abs(p.py - r) > .001){ const d = r - p.py; const to = {py:r}; if (p.alpha < 1) to.alpha = 1;
      proms.push(tween(p, to, 110 + 70*Math.sqrt(Math.abs(d)), E.inQuad, p.delay || 0)); p.delay = 0; }
  }
  await Promise.all(proms);
}
async function resolveBoard(pref, first = {}){
  let cascade = 0, opts = first;
  for (let guard=0; guard<60; guard++){
    const groups = computeGroups(pref); pref = null;
    if (!groups.length && !(opts.forced && opts.forced.length)) break;
    cascade++;
    await clearStep({...opts, groups, cascade});
    opts = {};
    await applyGravity();
  }
}

/* ---------- player actions ---------- */
async function trySwap(r1, c1, r2, c2){
  if (busy || state.ended || !inB(r1,c1) || !inB(r2,c2)) return;
  if (blk[r1][c1] || blk[r2][c2]) return;
  const a = grid[r1][c1], b = grid[r2][c2]; if (!a || !b) return;
  busy = true; clearHint(); sel = null;
  sfx.swap();
  await Promise.all([tween(a, {px:c2, py:r2}, 160, E.inOut), tween(b, {px:c1, py:r1}, 160, E.inOut)]);
  grid[r1][c1] = b; grid[r2][c2] = a;
  if (a.special === 'bomb' || b.special === 'bomb' || (a.special && b.special)){
    useMove(); await comboActivate(a, b, r1, c1, r2, c2);
  } else {
    if (!computeGroups(null).length){
      sfx.bad(); buzz([10,30,10]);
      await Promise.all([tween(a, {px:c1, py:r1}, 160, E.inOut), tween(b, {px:c2, py:r2}, 160, E.inOut)]);
      grid[r1][c1] = a; grid[r2][c2] = b; busy = false; scheduleHint(); return;
    }
    useMove(); await resolveBoard([[r2,c2],[r1,c1]]);
  }
  await afterTurn();
  busy = false;
}
async function comboActivate(a, b, r1, c1, r2, c2){
  // a now sits at (r2,c2), b at (r1,c1)

  const forced = new Set([key(r1,c1), key(r2,c2)]); const fx = []; let bonus = 0;
  const sa = a.special, sb = b.special;
  const addRow = r => { if (r>=0 && r<ROWS) for (let c=0;c<COLS;c++) forced.add(key(r,c)); };
  const addCol = c => { if (c>=0 && c<COLS) for (let r=0;r<ROWS;r++) forced.add(key(r,c)); };
  if (sa === 'bomb' && sb === 'bomb'){
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) forced.add(key(r,c));
    fx.push({kind:'flash'}, {kind:'ring', r:r2, c:c2, rad:9}); bonus = 800; banner('En-bloc mega deal!', '#ffd23f'); buzz([40,30,40,30,90]);
  } else if (sa === 'bomb' || sb === 'bomb'){
    const bomb = sa === 'bomb' ? a : b, other = sa === 'bomb' ? b : a; const [br,bc] = sa === 'bomb' ? [r2,c2] : [r1,c1];
    const t = other.type, os = other.special; const tg = [];

    if (os === 'h' || os === 'v' || os === 'wrap'){

      for (const [r,c] of tg){ const q = grid[r][c]; q.special = os === 'wrap' ? 'wrap' : (Math.random() < .5 ? 'h' : 'v'); q.scale = 1.35; tween(q, {scale:1}, 260, E.outBack); }
      banner(os === 'wrap' ? 'Reno everywhere!' : 'MRT network!', '#ffd23f');
      await sleep(520);
    } else { fx.push({kind:'bolt', r:br, c:bc, targets:tg}); }
    tg.forEach(([r,c]) => forced.add(key(r,c))); bonus = 200;
  } else if ((sa === 'h' || sa === 'v') && (sb === 'h' || sb === 'v')){
    addRow(r2); addCol(c2); fx.push({kind:'beam', dir:'h', r:r2, c:c2}, {kind:'beam', dir:'v', r:r2, c:c2}); bonus = 150; banner('Cross-island line!', '#9fe6ff');
  } else if (sa === 'wrap' && sb === 'wrap'){
    for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++) if (inB(r2+dr,c2+dc)) forced.add(key(r2+dr,c2+dc));
    fx.push({kind:'ring', r:r2, c:c2, rad:3}); bonus = 220; banner('Mega reno!', '#ffb4e6');
  } else { // striped + wrap
    for (let d=-1; d<=1; d++){ addRow(r2+d); addCol(c2+d); fx.push({kind:'beam', dir:'h', r:r2+d, c:c2}, {kind:'beam', dir:'v', r:r2, c:c2+d}); }
    fx.push({kind:'ring', r:r2, c:c2, rad:2}); bonus = 250; banner('Big MRT upgrade!', '#9fe6ff');

}
function useMove(){ if (state.mode === 'level'){ state.moves = Math.max(0, state.moves-1); updateHUD(); } }

  busy = true; setHammer(false); clearHint();
  if (state.boosters.hammer !== Infinity) state.boosters.hammer--;

  await resolveBoard(null, {forced:[key(r,c)]});

}
async function shuffleBoard(){
  sfx.shuffle(); buzz(20);
  const cells = [], pieces = [];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (grid[r][c] && !blk[r][c]){ cells.push([r,c]); pieces.push(grid[r][c]); }
  for (let attempt=0; attempt<300; attempt++){
    for (let i=pieces.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [pieces[i],pieces[j]] = [pieces[j],pieces[i]]; }
    if (attempt > 120) pieces.forEach(p => { if (!p.special) p.type = randType(); });
    cells.forEach(([r,c],i) => grid[r][c] = pieces[i]);
    if (!findRuns().length && hasMove()) break;

  await Promise.all(cells.map(([r,c]) => tween(grid[r][c], {px:c, py:r}, 450, E.inOut)));

  }

  for (let i=0; i<3 && !hasMove(); i++){ banner('En-bloc! Reshuffling…', '#9fe6ff'); await sleep(600); await shuffleBoard(); }
  scheduleHint();
}
async function finale(){

  banner('Huat Finale!', '#ffd23f'); sfx.win(); await sleep(800);
  while (state.moves > 0){
    const cand = []; for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ const p = grid[r][c]; if (p && !p.special && !blk[r][c]) cand.push(p); }
    if (!cand.length) break;
    const p = cand[Math.floor(Math.random()*cand.length)]; p.special = Math.random() < .5 ? 'h' : 'v'; p.scale = 1.5; tween(p, {scale:1}, 220, E.outBack);
    state.moves--; state.score += 30; updateHUD(); sfx.ding(); burst((p.px+.5)*cs, (p.py+.5)*cs, '#ffd23f', 5);

function drawIce(g, x, y, s, L){

}
function drawPiece(g, p, now, hintSet){

      rrect(g, -h*.96, -h*.96, h*1.92, h*1.92, h*.5); g.stroke(); g.shadowBlur = 0;

function render(now, dt){
  const g = ctx; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,BS,BS);
  let ox = 0, oy = 0; if (shake.mag > .3){ ox = (Math.random()*2-1)*shake.mag; oy = (Math.random()*2-1)*shake.mag; shake.mag *= Math.pow(.02, dt); } else shake.mag = 0;

  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ rrect(g, c*cs+1.5, r*cs+1.5, cs-3, cs-3, cs*.18); g.fillStyle = (r+c)%2 ? 'rgba(255,255,255,.11)' : 'rgba(255,255,255,.05)'; g.fill(); }
  if (sel){ rrect(g, sel.c*cs+1, sel.r*cs+1, cs-2, cs-2, cs*.2); g.lineWidth = 3; g.strokeStyle = '#ffd23f'; g.shadowColor = '#ffd23f'; g.shadowBlur = 12; g.stroke(); g.shadowBlur = 0; }

  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ const p = grid[r] && grid[r][c]; if (p) drawPiece(g, p, now, hintSet); }
  g.restore();
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (blk[r] && blk[r][c]) drawIce(g, c*cs, r*cs, cs, blk[r][c]);
  // effects
  for (let i=fxList.length-1;i>=0;i--){
    const e = fxList[i]; const life = (e.kind === 'flash' ? 500 : 420)*Math.max(TS,.2); const t = (now - e.t0)/life;
    if (t >= 1){ fxList.splice(i,1); continue; }
    const a = 1 - t;
    if (e.kind === 'beam'){ const w = cs*(.85 - .6*t);
      const gr = e.dir === 'h' ? g.createLinearGradient(0, (e.r+.5)*cs - w/2, 0, (e.r+.5)*cs + w/2) : g.createLinearGradient((e.c+.5)*cs - w/2, 0, (e.c+.5)*cs + w/2, 0);

      if (e.dir === 'h') g.fillRect(-4, (e.r+.5)*cs - w/2, W+8, w); else g.fillRect((e.c+.5)*cs - w/2, -4, w, H+8); }
    else if (e.kind === 'ring'){ g.beginPath(); g.arc((e.c+.5)*cs, (e.r+.5)*cs, cs*e.rad*E.outQuad(t) + 2, 0, Math.PI*2); g.lineWidth = cs*.35*a; g.strokeStyle = `rgba(255,220,120,${a})`; g.stroke(); }
    else if (e.kind === 'bolt'){ g.lineWidth = 3; g.strokeStyle = `rgba(255,230,120,${a})`; g.shadowColor = '#ffd23f'; g.shadowBlur = 10;
      const x0 = (e.c+.5)*cs, y0 = (e.r+.5)*cs;
      for (const [r,c] of e.targets){ g.beginPath(); g.moveTo(x0, y0); const x1 = (c+.5)*cs, y1 = (r+.5)*cs, mx = (x0+x1)/2 + (Math.random()-.5)*cs*.5, my = (y0+y1)/2 + (Math.random()-.5)*cs*.5; g.lineTo(mx, my); g.lineTo(x1, y1); g.stroke(); }
      g.shadowBlur = 0; }

  }
  // particles
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life += dt; if (p.life >= p.max){ parts.splice(i,1); continue; }
    p.vy += cs*16*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += dt*8; const a = 1 - p.life/p.max;

    else if (p.shape === 'sq'){ g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.color; g.fillRect(-p.size, -p.size, p.size*2, p.size*2); g.restore(); }
    else { g.beginPath(); g.arc(p.x, p.y, p.size, 0, Math.PI*2); g.fillStyle = p.color; g.fill(); }
  }
  g.globalAlpha = 1;
  // floaters
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i]; f.life += dt/Math.max(TS,.2); if (f.life >= f.max){ floaters.splice(i,1); continue; }
    const t = f.life/f.max; const fs = Math.round(cs*.42*f.size);
    g.globalAlpha = t < .7 ? 1 : 1 - (t-.7)/.3; g.font = `700 ${fs}px Fredoka, sans-serif`;
    const yy = f.y - t*cs*.9; g.lineWidth = fs*.22; g.strokeStyle = '#2b1060'; g.strokeText(f.text, f.x, yy); g.fillStyle = f.color; g.fillText(f.text, f.x, yy);
  }
  g.globalAlpha = 1;

  for (let i=banners.length-1;i>=0;i--){
    const b = banners[i]; const t = (now - b.t0)/b.life; if (t >= 1){ banners.splice(i,1); continue; }
    const s = t < .25 ? E.outBack(t/.25) : 1; const a = t < .75 ? 1 : 1 - (t-.75)/.25;
    let fs = Math.round(BS*.115); g.font = `700 ${fs}px Fredoka, sans-serif`;
    const tw = g.measureText(b.text).width; if (tw > W*.95){ fs = Math.floor(fs*W*.95/tw); g.font = `700 ${fs}px Fredoka, sans-serif`; }
    g.save(); g.translate(W/2, H*.42 - t*cs*.4); g.scale(s, s); g.globalAlpha = a; g.rotate(-.04);
    g.lineWidth = fs*.26; g.strokeStyle = '#3b0f6e'; g.strokeText(b.text, 0, 0);
    const gr = g.createLinearGradient(0, -fs/2, 0, fs/2); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, b.color); g.fillStyle = gr; g.fillText(b.text, 0, 0);

}
let lastT = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - lastT)/1000); lastT = now;

  requestAnimationFrame(frame);
}

let drag = null;
function cellFromEvent(e){
  const r = canvas.getBoundingClientRect(); const x = e.clientX - r.left - PAD, y = e.clientY - r.top - PAD;
  const c = Math.floor(x/cs), row = Math.floor(y/cs); return inB(row,c) ? {r:row, c} : null;
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); const cell = cellFromEvent(e); if (!cell) return;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  drag = {x:e.clientX, y:e.clientY, r:cell.r, c:cell.c, moved:false, id:e.pointerId};
});
canvas.addEventListener('pointermove', e => {
  if (!drag || drag.moved || e.pointerId !== drag.id || hammerMode) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; const th = Math.max(12, cs*.32);
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  drag.moved = true; let dr = 0, dc = 0; if (Math.abs(dx) > Math.abs(dy)) dc = Math.sign(dx); else dr = Math.sign(dy);
  sel = null; trySwap(drag.r, drag.c, drag.r+dr, drag.c+dc);
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; if (d.moved || e.type === 'pointercancel') return;
  handleTap(d.r, d.c);
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());
function handleTap(r, c){
  if (busy || state.ended) return;
  if (hammerMode){ useHammer(r, c); return; }
  if (!grid[r][c] || blk[r][c]){ sel = null; return; }
  if (sel){
    if (sel.r === r && sel.c === c){ sel = null; return; }
    if (Math.abs(sel.r - r) + Math.abs(sel.c - c) === 1){ const s = sel; sel = null; trySwap(s.r, s.c, r, c); return; }
  }
  sel = {r, c}; sfx.click(); clearHint(); scheduleHint();
}

  banner('En-bloc!', '#9fe6ff'); await shuffleBoard(); await afterTurn(); busy = false;
};
$('bExtend').onclick = () => { if (busy || state.ended || !state.boosters.extend) return; setHammer(false); extendLease(); };
modal.addEventListener('pointerdown', e => { if (e.target === modal && !card.querySelector('#mGo, #mNext, #mRetry')) hideModal(); });
new ResizeObserver(() => { if ($('game').classList.contains('active')) layout(); }).observe($('boardWrap'));
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

/* boot */
(async function boot(){
  $('parade').innerHTML = TYPES.map((_,i) => pieceImgTag(i)).join('');
  pieceImgs = await Promise.all(PIECE_URLS.map(loadImg)); keyImg = await loadImg(KEY_URL);
  try{ await document.fonts.load('700 20px Fredoka'); }catch(e){}
  goTitle();
  requestAnimationFrame(frame);
})();

/* test hook (only with ?debug in the URL) */
if (/[?&]debug\b/.test(location.search)) window.__hh = { get state(){ return state; }, get busy(){ return busy; }, get grid(){ return grid; }, get blk(){ return blk; },
  setTS(v){ TS = v; }, hasMove, trySwap, levelConfig, startLevel, startZen, useHammer };

/* =========================================================
   PWA — service worker + install prompts
   ========================================================= */
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installEvt = null;
const installBtn = $('btnInstall');
function refreshInstallBtn(){ installBtn.hidden = isStandalone() || !(installEvt || isIOS); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; refreshInstallBtn(); });
window.addEventListener('appinstalled', () => { installEvt = null; refreshInstallBtn(); banner('Installed! Huat ah!'); });
installBtn.onclick = async () => {
  sfx.click();
  if (installEvt){
    installEvt.prompt();
    try{ await installEvt.userChoice; }catch(e){}
    installEvt = null; refreshInstallBtn(); return;
  }
  const share = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9fd0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>';
  showModal(`<h2>Install Huat Homes</h2>
    <p>Add the game to your Home Screen to play full-screen, even offline.</p>
    <div class="ios-steps">
      <div><span class="n">1</span><span>Open this page in <b>Safari</b> and tap the Share button ${share}</span></div>
      <div><span class="n">2</span><span>Scroll down and tap <b>Add to Home Screen</b></span></div>
      <div><span class="n">3</span><span>Tap <b>Add</b>. Launch it from your Home Screen.</span></div>
    </div>
    <div class="btns"><button class="btn big gold" id="mClose">Got it</button></div>`, {mClose:hideModal});
};
refreshInstallBtn();
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(() => {}); });
}
</script>
</body>
